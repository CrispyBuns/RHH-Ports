name: Build Rusty for RG35XX-H (KNULLI)

on:
  workflow_dispatch:
    inputs:
      include_english:
        description: "Build the optional 46 OkuMen English translation modules if present"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    container:
      image: arm64v8/ubuntu:22.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RUSTY_REPO: ${{ secrets.RUSTY_REPO }}
      SDL2_BACKEND_REPO: https://github.com/bmdhacks/SDL.git
      SDL2_BACKEND_BRANCH: sdl2-backend

    steps:
      - name: Install Ubuntu 22.04 ARM64 build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config ninja-build \
            python3 python3-pip python3-venv software-properties-common \
            gnupg gpg-agent dirmngr zip file binutils \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxfixes-dev libxss-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev libwayland-dev \
            libusb-1.0-0-dev libdrm-dev libgbm-dev
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.11 python3.11-venv python3.11-dev
          python3.11 -m pip install --no-cache-dir cmake==3.31.6 uv

      - name: Build glslc shader compiler from source (Ubuntu 22.04 ARM64)
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/google/shaderc.git shaderc
          cd shaderc
          python3.11 utils/git-sync-deps
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          # Do not set SHADERC_SKIP_EXAMPLES: this can omit the glslc CLI target.
          cmake --build build --parallel "$(nproc)" --verbose
          echo "Shaderc glslc build outputs:"
          find build/glslc -maxdepth 4 -type f -print 2>/dev/null || true
          GLSLC_BIN="$(find build -type f -name glslc -print -quit)"
          if [[ -z "$GLSLC_BIN" ]]; then
            echo "::error::Shaderc build completed but no glslc executable was produced"
            echo "Ninja targets:"
            ninja -C build -t targets all | grep -i glslc || true
            echo "Build files:"
            find build -maxdepth 5 -type f | sort | tail -100
            exit 1
          fi
          echo "Found glslc at: $GLSLC_BIN"
          test -x "$GLSLC_BIN" || chmod 0755 "$GLSLC_BIN"
          install -m 0755 "$GLSLC_BIN" /usr/local/bin/glslc
          glslc --version

      - name: Checkout Rusty source
        uses: actions/checkout@v4
        with:
          repository: karmasugar/rusty-bin
          ref: main
          path: rusty-src

      - name: Checkout PortMaster package files
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/RHH-Ports
          ref: main
          path: port-files

      - name: Fetch private game files
        env:
          RUSTY_TOKEN: ${{ secrets.RUSTY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RUSTY_TOKEN" || { echo "::error::RUSTY_TOKEN secret is empty or unavailable"; exit 1; }
          git clone --depth 1 "https://x-access-token:${RUSTY_TOKEN}@github.com/${RUSTY_REPO}.git" private-game-data
          unset RUSTY_TOKEN
          find private-game-data -type f -printf '%p\n' | sed -n '1,100p'

      - name: Prepare Japanese and optional English game files
        working-directory: rusty-src
        env:
          INCLUDE_ENGLISH: ${{ inputs.include_english }}
        run: |
          set -euo pipefail
          mkdir -p build/files/ja build/unpacked/ja
          mapfile -d '' hdis < <(find ../private-game-data -type f \( -iname '*.hdi' -o -iname '*.d88' -o -iname '*.hdm' \) -print0)
          (("${#hdis[@]}" > 0)) || { echo "::error::No Rusty disk image (.hdi/.d88/.hdm) found in private repo $RUSTY_REPO"; exit 1; }
          ja_image=""
          en_image=""
          for f in "${hdis[@]}"; do
            name="$(basename "$f" | tr '[:upper:]' '[:lower:]')"
            if [[ "$name" == *"46 okum"* || "$name" == *"46okum"* || "$name" == *"translation"* || "$name" == *"english"* ]]; then
              [[ -z "$en_image" ]] && en_image="$f"
            elif [[ -z "$ja_image" ]]; then
              ja_image="$f"
            fi
          done
          if [[ -n "$en_image" ]]; then
            echo "Preferred game version: English 46 OkuMen translation"
            echo "English image: $(basename "$en_image")"
          else
            echo "No English translation image found; falling back to Japanese original."
          fi
          test -n "$ja_image" || { echo "::error::Japanese original image is required as Rusty's baseline"; exit 1; }
          echo "Japanese baseline: $(basename "$ja_image")"
          python3.11 tools/extract.py "$ja_image" -o build/files/ja
          test -d build/files/ja/RUSTY || { echo "::error::Japanese extraction did not produce build/files/ja/RUSTY"; find build/files/ja -maxdepth 3 -type f; exit 1; }
          python3.11 tools/lz_unpack.py build/files/ja/RUSTY build/unpacked/ja --copy-plain
          python3.11 tools/exepack.py build/unpacked/ja
          if [[ -n "$en_image" && "$INCLUDE_ENGLISH" == "true" ]]; then
            mkdir -p build/files/base build/unpacked/base
            python3.11 tools/extract.py "$en_image" -o build/files/base
            python3.11 tools/lz_unpack.py build/files/base build/unpacked/base --copy-plain
            python3.11 tools/exepack.py build/unpacked/base
            test -f build/unpacked/base/BOOT.COM || { echo "::error::English image extraction did not produce BOOT.COM"; exit 1; }
            echo "RUSTY_ENGLISH=ON" >> "$GITHUB_ENV"
          else
            echo "RUSTY_ENGLISH=OFF" >> "$GITHUB_ENV"
          fi
          for required in BOOT.COM JO.EXE; do
            test -f "build/unpacked/ja/$required" || { echo "::error::Missing required extracted file $required"; exit 1; }
          done

      - name: Build SDL3 SDL2-backend shim (no KMS/DRM)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SDL2_BACKEND_BRANCH" "$SDL2_BACKEND_REPO" SDL
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git SPIRV-Cross
          cmake -S SDL -B SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -mcpu=cortex-a53 -flto -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto" \
            -DCMAKE_SHARED_LINKER_FLAGS="-flto -Wl,--gc-sections" \
            -DSDL_SDL2_BACKEND=ON \
            -DSDL_SPIRV_CROSS_DIR="$GITHUB_WORKSPACE/SPIRV-Cross" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_INSTALL=ON \
            -DSDL_GPU=ON -DSDL_RENDER_GPU=ON \
            -DSDL_VIDEO=ON -DSDL_AUDIO=ON -DSDL_JOYSTICK=ON \
            -DSDL_HIDAPI=OFF -DSDL_VULKAN=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_PIPEWIRE=OFF -DSDL_PULSEAUDIO=OFF -DSDL_ALSA=OFF \
            -DSDL_SNDIO=OFF -DSDL_OSS=OFF -DSDL_JACK=OFF \
            -DSDL_OFFSCREEN=OFF -DSDL_DUMMYVIDEO=OFF \
            -DSDL_DUMMYAUDIO=OFF -DSDL_DISKAUDIO=OFF
          cmake --build SDL/build --parallel "$(nproc)"
          cmake --install SDL/build --prefix "$GITHUB_WORKSPACE/sdl3-install"
          SDL3_LIB="$(find "$GITHUB_WORKSPACE/sdl3-install" -name 'libSDL3.so*' -type f | head -n 1)"
          test -n "$SDL3_LIB" || { echo "::error::Installed SDL3 shared library not found"; exit 1; }
          echo "SDL3_LIB=$SDL3_LIB" >> "$GITHUB_ENV"

      - name: Build Rusty ARM64 binary
        working-directory: rusty-src
        run: |
          set -euo pipefail
          python3.11 -m pip install --no-cache-dir uv
          uv sync --python 3.11
          python3.11 - <<'PY'
          from pathlib import Path
          path = Path("runtime/display.c")
          source = path.read_text()
          needle = "static void handle_gamepad_button(const SDL_GamepadButtonEvent *event)\n{\n"
          patch = """static int quit_start_held;
          static int quit_select_held;

          static void handle_gamepad_button(const SDL_GamepadButtonEvent *event)
          {
              if (event->button == SDL_GAMEPAD_BUTTON_START) quit_start_held = event->down;
              if (event->button == SDL_GAMEPAD_BUTTON_BACK) quit_select_held = event->down;
              if (quit_start_held && quit_select_held) {
                  rt_log("quit: Start+Select");
                  exit(0);
              }
          """
          if needle not in source:
              raise SystemExit("Could not locate SDL gamepad handler; refusing to apply exit-chord patch")
          path.write_text(source.replace(needle, patch, 1))
          PY
          sed -i 's/set(C_WARNINGS -Wall -Wextra -Werror)/set(C_WARNINGS -Wall -Wextra)/' CMakeLists.txt
          sed -i 's/set(C_OPTIONS -O2 ${C_WARNINGS})/set(C_OPTIONS -O3 ${C_WARNINGS})/' CMakeLists.txt
          cmake -S . -B build/rg35xx-h -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdl3-install" \
            -DCMAKE_C_FLAGS="-O3 -mcpu=cortex-a53 -flto -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -mcpu=cortex-a53 -flto -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto -Wl,--gc-sections" \
            -DRUSTY_RELEASE=ON \
            -DRUSTY_ENGLISH="$RUSTY_ENGLISH" \
            -DRUSTY_PYTHON="$PWD/.venv/bin/python"
          cmake --build build/rg35xx-h --target rusty --parallel "$(nproc)"
          test -x build/rg35xx-h/rusty
          file build/rg35xx-h/rusty
          readelf -h build/rg35xx-h/rusty | grep -E 'Class:|Machine:'

      - name: Assemble PortMaster package
        working-directory: rusty-src
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          mkdir -p "$PKG/roms" "$PKG/lib" "$PKG/licenses"
          install -m 0755 build/rg35xx-h/rusty "$PKG/rusty"
          install -m 0644 "$SDL3_LIB" "$PKG/lib/libSDL3.so.0"
          install -m 0644 LICENSE "$PKG/LICENSE"
          install -m 0644 packaging/README.txt "$PKG/README.txt"
          install -m 0644 packaging/portable.txt "$PKG/portable.txt"
          install -m 0644 third_party/ymfm/LICENSE "$PKG/licenses/ymfm-LICENSE.txt"
          install -m 0644 packaging/licenses/SDL3-LICENSE.txt "$PKG/licenses/SDL3-LICENSE.txt"
          touch "$PKG/log.txt"
          cat > "$PKG/ASSETS_REQUIRED.txt" <<'EOF'
          Rusty requires user-supplied game data. Copy your own Rusty game disk image (.hdi/.d88/.hdm), FONT.ROM, and ym2608_adpcm_rom.bin into roms/.
          EOF
          cp "$GITHUB_WORKSPACE/port-files/ports/unreleased/rusty/Rusty.sh" "$PKG/Rusty.sh"
          cp "$GITHUB_WORKSPACE/port-files/ports/unreleased/rusty/port.json" "$PKG/port.json"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd "$PKG"
          zip -r "$GITHUB_WORKSPACE/artifacts/rusty-rg35xx-h.zip" .

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rusty-rg35xx-h-portmaster
          path: artifacts/rusty-rg35xx-h.zip
          if-no-files-found: error
          retention-days: 30
