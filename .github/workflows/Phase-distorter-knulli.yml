name: Build Phase Distorter RG35XX-H KNULLI autoinstall

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - phase-distorter-autoinstall
    paths:
      - '.github/workflows/Phase-distorter-knulli.yml'
      - 'ports/unreleased/phase-distorter/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      # RG35XX-H: AArch64 / ARMv8-A, quad-core Cortex-A53.
      CFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffast-math -ffunction-sections -fdata-sections"
      CXXFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffast-math -ffunction-sections -fdata-sections"
      LDFLAGS: "-Wl,--gc-sections"
    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config zip unzip file binutils libsdl2-dev libgl-dev libegl-dev

      - name: Checkout Phase Distorter source
        uses: actions/checkout@v7.0.1
        with:
          repository: CrispyBuns/Phase-Distorter
          # main includes EXT-to-core framebuffer symbol fallback for GL4ES.
          ref: main
          path: Phase-Distorter

      - name: Verify checked-out Phase Distorter revision
        run: |
          set -euo pipefail
          git -C Phase-Distorter log -1 --format='Phase-Distorter source commit: %H%nSubject: %s'
          grep -n 'GL_PROC_FALLBACK(PFNGLGENFRAMEBUFFERSEXTPROC, GenFramebuffersEXT, GenFramebuffers)' Phase-Distorter/cpp/src/scene_effects_renderer.cpp

      - name: Build GL4ES compatibility library
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git GL4ES
          cmake -S GL4ES -B GL4ES/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=armv8-a -mtune=cortex-a53 -ffast-math -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a -mtune=cortex-a53 -ffast-math -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON \
            2>&1 | tee GL4ES/configure.log
          cmake --build GL4ES/build --parallel 4 2>&1 | tee GL4ES/build.log
          gl4es_lib="$(find GL4ES -type f -name 'libGL.so.1' -print -quit)"
          test -n "$gl4es_lib"
          echo "GL4ES library: $gl4es_lib"

      - name: Verify pre-generated Phase Distorter sources
        run: |
          set -euo pipefail
          generated="$GITHUB_WORKSPACE/Phase-Distorter/generated"
          test -s "$generated/program_sources.cmake"
          test -s "$generated/game_runtime_sources.cmake"
          test -s "$generated/game_runtime_manifest.json"
          test -s "$generated/us/game/runtime_index.json"
          test -s "$generated/jp/game/runtime_index.json"
          echo "Required generated source manifests are present."

      - name: Configure and build Phase Distorter
        run: |
          set -euo pipefail
          generated="$GITHUB_WORKSPACE/Phase-Distorter/generated"
          extra_cxx_flags="-O3 -DNDEBUG -march=armv8-a -mtune=cortex-a53 -ffast-math -ffunction-sections -fdata-sections -flto"
          extra_link_flags="-Wl,--gc-sections -flto"

          cmake -S Phase-Distorter/cpp -B Phase-Distorter/build-knulli -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="$extra_cxx_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$extra_link_flags" \
            -DEB_PREGENERATED_DIR="$generated" \
            -DEB_BUILD_TESTS=OFF \
            -DEB_BUILD_FRONTEND=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON 2>&1 | tee Phase-Distorter/configure-knulli.log
          cmake --build Phase-Distorter/build-knulli --parallel 4 2>&1 | tee Phase-Distorter/build-knulli.log
          test -x Phase-Distorter/build-knulli/eb_cpp
          file Phase-Distorter/build-knulli/eb_cpp
          readelf -h Phase-Distorter/build-knulli/eb_cpp | grep -E 'Machine:.*AArch64'

      - name: Assemble and validate PortMaster autoinstall ZIP
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/package"
          port_dir="$package_dir/phase-distorter"
          mkdir -p "$port_dir/libs"

          install -m 755 Phase-Distorter/build-knulli/eb_cpp "$port_dir/eb_cpp"
          install -m 755 "ports/unreleased/phase-distorter/Phase Distorter.sh" "$package_dir/Phase Distorter.sh"
          install -m 644 "ports/unreleased/phase-distorter/phase-distorter/port.json" "$port_dir/port.json"

          gl4es_lib="$(find GL4ES -type f -name 'libGL.so.1' -print -quit)"
          test -n "$gl4es_lib"
          install -m 755 "$gl4es_lib" "$port_dir/libs/libGL.so.1"

          cat > "$port_dir/README.txt" <<'EOF'
          Phase Distorter for RG35XX-H / KNULLI (experimental)

          Launch Phase Distorter.sh from the Ports menu. Use the game's setup
          window to import your own supported ROM. ROMs and imported assets are
          not included.

          This build is tuned for the Cortex-A53 with -O3, -ffast-math, LTO,
          and section garbage collection. GL4ES is built without GBM/KMS/DRM.
          Runtime output is written to /roms/ports/phase-distorter/log.txt.
          Experimental.
          EOF

          cd "$package_dir"
          zip -r "$GITHUB_WORKSPACE/phase-distorter-knulli.zip" "Phase Distorter.sh" phase-distorter
          unzip -t "$GITHUB_WORKSPACE/phase-distorter-knulli.zip"

      - name: Upload PortMaster autoinstall artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase-distorter-knulli-autoinstall
          path: phase-distorter-knulli.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase-distorter-knulli-build-logs
          path: |
            GL4ES/configure.log
            GL4ES/build.log
            Phase-Distorter/configure-knulli.log
            Phase-Distorter/build-knulli.log
          if-no-files-found: warn
          retention-days: 14
