name: Build Phase Distorter RG35XX-H KNULLI autoinstall

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build configuration"
        type: choice
        required: true
        default: release
        options:
          - release
          - profile-gen
          - profile-use
  push:
    branches:
      - phase-distorter-autoinstall
    paths:
      - '.github/workflows/Phase-distorter-knulli.yml'
      - 'ports/unreleased/phase-distorter/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      # RG35XX-H is AArch64 / ARMv8-A with a quad-core Cortex-A53.
      CFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
      CXXFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
      LDFLAGS: "-Wl,--gc-sections"
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config zip unzip file binutils libsdl2-dev libgl-dev libegl-dev

      - name: Checkout Phase Distorter source and committed PGO profiles
        uses: actions/checkout@v7.0.1
        with:
          repository: CrispyBuns/Phase-Distorter
          ref: main
          path: Phase-Distorter

      - name: Validate PGO profiles for profile-use
        if: env.BUILD_MODE == 'profile-use'
        run: |
          set -euo pipefail
          if ! find Phase-Distorter/debug -type f -name '*.gcda' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No .gcda profiles found in Phase-Distorter/debug/. Commit the profile-generation data to CrispyBuns/Phase-Distorter/debug and rerun."
            exit 1
          fi

      - name: Build GL4ES compatibility library
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git GL4ES
          cmake -S GL4ES -B GL4ES/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -march=armv8-a -mtune=cortex-a53" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8-a -mtune=cortex-a53" \
            -DNOX11=ON -DGLX_STUBS=ON -DEGL_WRAPPER=ON
          cmake --build GL4ES/build --parallel 4
          gl4es_lib="$(find GL4ES -type f -name 'libGL.so.1' -print -quit)"
          test -n "$gl4es_lib"
          echo "GL4ES library: $gl4es_lib"

      - name: Verify pre-generated Phase Distorter sources
        run: |
          set -euo pipefail
          generated="$GITHUB_WORKSPACE/Phase-Distorter/generated"
          test -s "$generated/program_sources.cmake"
          test -s "$generated/game_runtime_sources.cmake"
          test -s "$generated/game_runtime_manifest.json"
          test -s "$generated/us/game/runtime_index.json"
          test -s "$generated/jp/game/runtime_index.json"
          echo "Required generated source manifests are present."

      - name: Configure and build Phase Distorter with LTO
        run: |
          set -euo pipefail
          generated="$GITHUB_WORKSPACE/Phase-Distorter/generated"
          extra_cxx_flags="-O3 -DNDEBUG -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections -flto -ffast-math"
          extra_link_flags="-Wl,--gc-sections -flto"
          profile_dir="$GITHUB_WORKSPACE/Phase-Distorter/debug"

          case "$BUILD_MODE" in
            release)
              echo "Building optimized release."
              ;;
            profile-gen)
              echo "Building instrumented PGO profile-generation binary."
              extra_cxx_flags="$extra_cxx_flags -fprofile-generate=debug"
              extra_link_flags="$extra_link_flags -fprofile-generate=debug"
              ;;
            profile-use)
              echo "Building with committed PGO profiles."
              extra_cxx_flags="$extra_cxx_flags -fprofile-use=$profile_dir -fprofile-correction"
              extra_link_flags="$extra_link_flags -fprofile-use=$profile_dir -fprofile-correction"
              ;;
            *)
              echo "::error::Unknown build mode: $BUILD_MODE"
              exit 1
              ;;
          esac

          cmake -S Phase-Distorter/cpp -B Phase-Distorter/build-knulli -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="$extra_cxx_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$extra_link_flags" \
            -DEB_PREGENERATED_DIR="$generated" \
            -DEB_BUILD_TESTS=OFF \
            -DEB_BUILD_FRONTEND=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON 2>&1 | tee Phase-Distorter/configure-knulli.log
          cmake --build Phase-Distorter/build-knulli --parallel 4
          test -x Phase-Distorter/build-knulli/eb_cpp
          file Phase-Distorter/build-knulli/eb_cpp
          readelf -h Phase-Distorter/build-knulli/eb_cpp | grep -E 'Machine:.*AArch64'

      - name: Assemble and validate PortMaster autoinstall ZIP
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/package"
          port_dir="$package_dir/phase-distorter"
          mkdir -p "$port_dir/libs" "$port_dir/debug"

          install -m 755 Phase-Distorter/build-knulli/eb_cpp "$port_dir/eb_cpp"
          install -m 755 "ports/unreleased/phase-distorter/Phase Distorter.sh" "$package_dir/Phase Distorter.sh"
          install -m 644 "ports/unreleased/phase-distorter/phase-distorter/port.json" "$port_dir/port.json"

          gl4es_lib="$(find GL4ES -type f -name 'libGL.so.1' -print -quit)"
          test -n "$gl4es_lib"
          install -m 755 "$gl4es_lib" "$port_dir/libs/libGL.so.1"

          cat > "$port_dir/README.txt" <<EOF
          Phase Distorter for RG35XX-H / KNULLI (experimental)
          Build mode: $BUILD_MODE
          Built using the Chaotix Recompiled workflow's ARM64 / Cortex-A53
          build-and-package pattern, adapted for Phase Distorter's CMake project
          and GL4ES compatibility layer.

          Launch Phase Distorter.sh from the Ports menu. Import your own supported
          ROM using the game's setup window. ROMs and imported assets are not included.

          PGO modes:
          - profile-gen: play representative gameplay on the handheld, then collect
            generated .gcda files from phase-distorter/debug/.
          - Commit the profile files into CrispyBuns/Phase-Distorter/debug/.
          - profile-use: rebuild with those committed profiles.
          - release: optimized build without PGO instrumentation.
          
          This build uses Cortex-A53 tuning, LTO, section garbage collection, and
          -ffast-math. GL4ES is built without GBM/KMS/DRM support. Experimental.
          EOF

          cd "$package_dir"
          zip -r "$GITHUB_WORKSPACE/phase-distorter-knulli.zip" "Phase Distorter.sh" phase-distorter
          unzip -t "$GITHUB_WORKSPACE/phase-distorter-knulli.zip"

      - name: Upload PortMaster autoinstall artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-distorter-knulli-${{ env.BUILD_MODE }}
          path: phase-distorter-knulli.zip
          if-no-files-found: error
          retention-days: 14
