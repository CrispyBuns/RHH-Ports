name: Build Phase Distorter Auto-Install ZIP

on:
  workflow_run:
    workflows: ["Build Ports"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-package:
    name: Build PD + GL4ES and package for PortMaster
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out RHH-Ports
        uses: actions/checkout@v5

      - name: Download Phase Distorter from Build Ports workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p _package/build _package/Phase-Distorter _build
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN_ID="$(gh run list --workflow build_ports.yml --branch phase-distorter-rg35xx-h-knulli --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n1)"
          fi
          [[ -n "${RUN_ID:-}" ]] || { echo "::error::No successful Build Ports run found."; exit 1; }
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("phase-distorter-build-")) | .name' | head -n1)"
          [[ -n "$artifact" ]] || { echo "::error::No Phase Distorter artifact found in Build Ports run $RUN_ID."; exit 1; }
          gh run download "$RUN_ID" --name "$artifact" --dir _package/build
          pd="$(find _package/build -type f -name 'Phase-Distorter' -print -quit)"
          [[ -n "$pd" ]] || { echo "::error::Build Ports artifact did not contain Phase-Distorter."; find _package/build -maxdepth 5 -type f -print; exit 1; }
          cp "$pd" _package/Phase-Distorter/Phase-Distorter
          file _package/Phase-Distorter/Phase-Distorter

      - name: Install GL4ES build dependencies (SDL2 not shipped)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git zip \
            libgl-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: Build GL4ES for OpenGL 2.1 compatibility via GLES2
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git _build/gl4es-src
          cmake -S _build/gl4es-src -B _build/gl4es-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOX11=ON \
            -DNO_GBM=ON \
            -DDEFAULT_ES=2
          cmake --build _build/gl4es-build --parallel "$(nproc)"
          gl4es_lib="$(find _build/gl4es-build _build/gl4es-src -type f \( -name 'libGL.so.1' -o -name 'libGL.so' \) -print -quit)"
          if [[ -z "$gl4es_lib" ]]; then
            echo "::error::GL4ES libGL output not found"
            find _build/gl4es-build -type f -print
            exit 1
          fi
          mkdir -p _package/Phase-Distorter/gl4es.aarch64
          cp -L "$gl4es_lib" _package/Phase-Distorter/gl4es.aarch64/libGL.so.1

      - name: Assemble PortMaster auto-install ZIP
        run: |
          set -euo pipefail
          port_dir=_package/Phase-Distorter
          cp ports/released/phase-distorter/phase-distorter/Phase-Distorter.sh "$port_dir/Phase-Distorter.sh"
          cp ports/released/phase-distorter/phase-distorter/README.md "$port_dir/README.md"
          cp ports/released/phase-distorter/phase-distorter/port.json "$port_dir/port.json"
          chmod +x "$port_dir/Phase-Distorter" "$port_dir/Phase-Distorter.sh"
          test -s "$port_dir/Phase-Distorter"
          test -s "$port_dir/gl4es.aarch64/libGL.so.1"
          test -s "$port_dir/Phase-Distorter.sh"
          # SDL2 is provided by KNULLI/PortMaster at runtime; deliberately do not package it.
          # Zip contents are rooted at the port directory for PortMaster installation.
          (cd "$port_dir" && zip -r "$GITHUB_WORKSPACE/Phase-Distorter-RG35XX-H-KNULLI.zip" .)
          unzip -l Phase-Distorter-RG35XX-H-KNULLI.zip
          unzip -t Phase-Distorter-RG35XX-H-KNULLI.zip

      - name: Upload PortMaster auto-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Phase-Distorter-RG35XX-H-KNULLI-AutoInstall
          path: Phase-Distorter-RG35XX-H-KNULLI.zip
          if-no-files-found: error
          retention-days: 30
