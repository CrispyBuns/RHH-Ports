name: Build Phase Distorter Auto-Install ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build PD + GL4ES and package for PortMaster
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out RHH-Ports
        uses: actions/checkout@v5

      - name: Install build dependencies (SDL2 is build-only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git zip \
            libsdl2-dev libgl-dev libegl1-mesa-dev libgles2-mesa-dev
          pkg-config --modversion sdl2

      - name: Build Phase Distorter for RG35XX-H (ARM64)
        run: |
          set -euo pipefail
          mkdir -p _build _package/Phase-Distorter
          git clone --depth 1 --branch rg35xx-h-knulli \
            https://github.com/CrispyBuns/Phase-Distorter.git _build/phase-distorter-src
          cmake -S _build/phase-distorter-src/cpp -B _build/pd-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEB_PREGENERATED_DIR="$GITHUB_WORKSPACE/_build/phase-distorter-src/generated" \
            -DEB_BUILD_TESTS=OFF \
            -DEB_BUILD_FRONTEND=ON \
            -DEB_TARGET_CORTEX_A53=ON
          cmake --build _build/pd-build --parallel "$(nproc)"
          if [[ -f _build/pd-build/eb_cpp ]]; then
            cp _build/pd-build/eb_cpp _package/Phase-Distorter/Phase-Distorter
          elif [[ -f _build/pd-build/Phase-Distorter ]]; then
            cp _build/pd-build/Phase-Distorter _package/Phase-Distorter/Phase-Distorter
          else
            echo "::error::Phase Distorter executable was not produced"
            find _build/pd-build -maxdepth 3 -type f -executable -print
            exit 1
          fi
          file _package/Phase-Distorter/Phase-Distorter
          chmod +x _package/Phase-Distorter/Phase-Distorter

      - name: Build GL4ES for OpenGL 2.1 compatibility via GLES2
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ptitSeb/gl4es.git _build/gl4es-src
          cmake -S _build/gl4es-src -B _build/gl4es-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOX11=ON \
            -DGBM=OFF \
            -DDEFAULT_ES=2 \
            -DEGL_WRAPPER=ON
          cmake --build _build/gl4es-build --parallel "$(nproc)"
          gl4es_lib="$(find _build/gl4es-build _build/gl4es-src -type f \( -name 'libGL.so.1' -o -name 'libGL.so' \) -print -quit)"
          if [[ -z "$gl4es_lib" ]]; then
            echo "::error::GL4ES libGL output not found"
            find _build/gl4es-build -type f -print
            exit 1
          fi
          gl4es_egl="$(find _build/gl4es-build _build/gl4es-src -type f -name 'libEGL.so.1' -print -quit)"
          if [[ -z "$gl4es_egl" ]]; then
            echo "::error::GL4ES EGL wrapper libEGL.so.1 not found (EGL_WRAPPER=ON)"
            find _build/gl4es-build _build/gl4es-src -type f -name '*EGL*' -print
            exit 1
          fi
          mkdir -p _package/Phase-Distorter/gl4es.aarch64
          cp -L "$gl4es_lib" _package/Phase-Distorter/gl4es.aarch64/libGL.so.1
          cp -L "$gl4es_egl" _package/Phase-Distorter/gl4es.aarch64/libEGL.so.1

      - name: Assemble PortMaster auto-install ZIP
        run: |
          set -euo pipefail
          port_dir=_package/Phase-Distorter
          cp ports/released/phase-distorter/phase-distorter/Phase-Distorter.sh "$port_dir/Phase-Distorter.sh"
          cp ports/released/phase-distorter/phase-distorter/README.md "$port_dir/README.md"
          cp ports/released/phase-distorter/phase-distorter/port.json "$port_dir/port.json"
          mkdir -p "$port_dir/Rom"
          touch "$port_dir/Rom/.keep"
          chmod +x "$port_dir/Phase-Distorter" "$port_dir/Phase-Distorter.sh"
          test -s "$port_dir/Phase-Distorter"
          test -s "$port_dir/gl4es.aarch64/libGL.so.1"
          test -s "$port_dir/gl4es.aarch64/libEGL.so.1"
          test -s "$port_dir/Phase-Distorter.sh"
          # SDL2 is provided by KNULLI/PortMaster at runtime; deliberately do not package it.
          # Zip contents are rooted at the port directory for PortMaster installation.
          (cd "$port_dir" && zip -r "$GITHUB_WORKSPACE/Phase-Distorter-RG35XX-H-KNULLI.zip" .)
          unzip -l Phase-Distorter-RG35XX-H-KNULLI.zip
          unzip -t Phase-Distorter-RG35XX-H-KNULLI.zip

      - name: Upload PortMaster auto-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Phase-Distorter-RG35XX-H-KNULLI-AutoInstall
          path: Phase-Distorter-RG35XX-H-KNULLI.zip
          if-no-files-found: error
          retention-days: 30
