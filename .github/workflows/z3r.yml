
name: Build Z3R-Beta RG35XX-H ARM64 Auto-Install

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package Z3R-Beta
    runs-on: ubuntu-24.04-arm

    container:
      image: ubuntu:20.04

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            build-essential \
            libsdl2-dev \
            python3 \
            pkg-config \
            zip \
            unzip \
            file \
            binutils \
            ca-certificates

      - name: Checkout RHH-Ports
        uses: actions/checkout@v4

      - name: Checkout Z3R-Beta
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/Z3R-Beta
          ref: main
          path: z3r-beta
          submodules: recursive

      - name: Verify ARM64 environment and source files
        shell: bash
        run: |
          set -eu

          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "aarch64"

          test -f z3r-beta/Makefile
          test -f z3r-beta/snes/ppu.h
          test -f z3r-beta/third_party/opus-1.3.1-stripped/opus_decoder_amalgam.c

          test -f buildtools/ports/z3r-beta/z3r-beta/src/Z3R-Beta.sh
          test -f buildtools/ports/z3r-beta/z3r-beta/src/port.json
          test -f buildtools/ports/z3r-beta/z3r-beta/src/zelda3.user.ini

          echo "Required files are present."

      - name: Compile Z3R-Beta for Cortex-A53
        shell: bash
        working-directory: z3r-beta
        run: |
          set -eu

          make clean
          make rg35xxx-h

          test -x zelda3

          file zelda3
          readelf -h zelda3 | grep -E 'Class:|Machine:'

      - name: Prepare PortMaster auto-install package
        shell: bash
        run: |
          set -eu

          PACKAGE="$GITHUB_WORKSPACE/package"
          PORT="$PACKAGE/z3r-beta"
          SOURCE="buildtools/ports/z3r-beta/z3r-beta/src"

          mkdir -p "$PORT"

          install -m 755 z3r-beta/zelda3 "$PORT/zelda3"
          install -m 644 "$SOURCE/port.json" "$PORT/port.json"
          install -m 644 "$SOURCE/zelda3.user.ini" "$PORT/zelda3.user.ini"
          install -m 755 "$SOURCE/Z3R-Beta.sh" "$PACKAGE/Z3R-Beta.sh"

          if [ -f "$SOURCE/README.md" ]; then
            install -m 644 "$SOURCE/README.md" "$PORT/README.md"
          fi

          cat > "$PORT/INSTALL-README.txt" <<'EOF'
          Z3R-Beta - RG35XX-H / KNULLI

          Architecture: ARM64 / AArch64
          CPU target: Cortex-A53
          Build target: make rg35xxx-h

          Optimization flags are defined in the Z3R-Beta Makefile.
          The Opus decoder is compiled without fast-math.

          Supply your own legally obtained game data.
          Follow the project's README and supported asset-generation
          process to create zelda3_assets.dat, then place it in
          the z3r-beta directory.

          Do not rename the zelda3 executable.
          Saves and runtime files are stored with the port.
          EOF

          test -x "$PORT/zelda3"
          test -x "$PACKAGE/Z3R-Beta.sh"
          test -f "$PORT/port.json"
          test -f "$PORT/zelda3.user.ini"

          cd "$PACKAGE"

          zip -r \
            "$GITHUB_WORKSPACE/Z3R-Beta-RG35XX-H-AutoInstall.zip" \
            Z3R-Beta.sh z3r-beta

      - name: Upload PortMaster auto-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Z3R-Beta-RG35XX-H-AutoInstall
          path: Z3R-Beta-RG35XX-H-AutoInstall.zip
          if-no-files-found: error
