name: Build Unreal Engine 1 v200 - RG35XX-H ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    env:
      CFLAGS: "-O3 -mcpu=cortex-a53 -ffunction-sections -fdata-sections -fno-strict-aliasing -fno-math-errno -fno-plt"
      CXXFLAGS: "-O3 -mcpu=cortex-a53 -ffunction-sections -fdata-sections -fno-strict-aliasing -fno-math-errno -fno-plt"
      LDFLAGS: "-flto=auto -Wl,--gc-sections -Wl,--as-needed"
    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v4

      - name: Install ARM64 build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config zip             libsdl2-dev libopenal-dev libxmp-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Checkout UE1 source
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/UE1-RG35XXX-G
          ref: rg35xx-h-arm64
          path: UE1

      - name: Configure SDL2 + OpenGL ES 2 + A53 + LTO
        run: |
          set -euxo pipefail
          cmake -S UE1/Source -B UE1/build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DUSE_SDL=ON \
            -DBUILD_EDITOR=OFF \
            -DBUILD_SOFTDRV=OFF \
            -DBUILD_NOPENGLDRV=OFF \
            -DBUILD_NOPENGLESDRV=ON \
            -DBUILD_NULLSOUNDDRV=OFF \
            -DBUILD_NOPENALDRV=ON \
            -DBUILD_WINDRV=OFF \
            -DBUILD_STATIC=OFF \
            -DCMAKE_C_FLAGS="${CFLAGS} -flto=auto -g" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS} -flto=auto -g" \
            -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build and install UE1
        run: |
          set -euxo pipefail
          cmake --build UE1/build --parallel 4
          cmake --install UE1/build
          # This project installs modules into its build-tree configuration folder.
          test -x UE1/build/RelWithDebInfo/Unreal.bin
          mkdir -p stage
          cp -a UE1/build/RelWithDebInfo/. stage/
          find stage -maxdepth 2 -type f -print
          test -x stage/Unreal.bin

      - name: Assemble PortMaster autoinstall package
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p package/unreal/System

          # Runtime modules and executable are installed together so UE1 can load its drivers.
          cp -a stage/. package/unreal/System/
          mkdir -p debug-symbols
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            objcopy --only-keep-debug "$file" "debug-symbols/$name.debug"
            strip --strip-debug "$file"
            objcopy --add-gnu-debuglink="debug-symbols/$name.debug" "$file"
          done < <(find package/unreal/System -maxdepth 1 -type f \( -name '*.bin' -o -name '*.so' \) -print0)

          cp -a UE1/Engine/Config/. package/unreal/System/
          # Bundle non-base audio runtimes; SDL2 and GLES remain firmware-provided.
          for library in libopenal.so.1 libxmp.so.4; do
            source_path=$(ldconfig -p | awk -v name="$library" '$1 == name { print $NF; exit }')
            if [ -z "$source_path" ] || [ ! -f "$source_path" ]; then
              echo "Required runtime library not found: $library" >&2
              exit 1
            fi
            cp -L "$source_path" "package/unreal/System/$library"
          done
          cat > package/unreal/README-assets.txt <<'EOF'
          REQUIRED GAME DATA (NOT INCLUDED)
          ---------------------------------
          This package contains the ARM64 engine/runtime only.
          Copy the original Unreal v200 retail or v205 demo game data into this
          folder: ports/unreal/System/

          Keep the engine files supplied by this package. Copy the original game
          data files (packages, maps, textures, sounds and configuration) into
          System without replacing Unreal.bin or the UE1 driver .so files.
          The source project documents v200 retail and v205 demo as supported.

          CONTROLS AND LOGGING
          --------------------
          Press Select + Start together to request a clean engine exit.
          Runtime diagnostics are written to ports/unreal/log.txt.
          EOF

          cat > 'package/Unreal.sh' <<'EOF'
          #!/bin/bash
          # PORTMASTER: unreal.zip, Unreal.sh
          set -u

          export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
          if [ -d "/opt/system/Tools/PortMaster" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster" ]; then
              controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
          else
              controlfolder="/roms/ports/PortMaster"
          fi

          if [ ! -r "$controlfolder/control.txt" ]; then
              echo "PortMaster control.txt not found: $controlfolder/control.txt" >&2
              exit 1
          fi
          source "$controlfolder/control.txt"
          [ -f "$controlfolder/mod_${CFW_NAME}.txt" ] && source "$controlfolder/mod_${CFW_NAME}.txt"
          get_controls

          GAMEDIR="/$directory/ports/unreal"
          SYSTEMDIR="$GAMEDIR/System"
          GAME="$SYSTEMDIR/Unreal.bin"
          LOGFILE="$GAMEDIR/log.txt"
          mkdir -p "$SYSTEMDIR"
          cd "$SYSTEMDIR" || exit 1
          : > "$LOGFILE"
          exec >> "$LOGFILE" 2>&1

          echo "[UE1] launcher started"
          echo "Firmware: ${CFW_NAME:-unknown}"
          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -sr)"
          echo "Renderer: SDL2 + OpenGL ES 2"
          echo "CPU target: Cortex-A53 / AArch64"
          echo "Engine directory: $SYSTEMDIR"

          if [ ! -x "$GAME" ]; then
              pm_show_error "Unreal ARM64 engine binary is missing. Reinstall the port."
              pm_finish
              exit 1
          fi
          if [ ! -f "$SYSTEMDIR/Engine.u" ]; then
              pm_show_error "Game data not found. Copy your legally obtained Unreal v200 or v205 demo System game data into ports/unreal/System. See README-assets.txt."
              pm_finish
              exit 1
          fi

          if [ -n "${LD_LIBRARY_PATH:-}" ]; then
              export LD_LIBRARY_PATH="$SYSTEMDIR:$SYSTEMDIR/libs:$LD_LIBRARY_PATH"
          else
              export LD_LIBRARY_PATH="$SYSTEMDIR:$SYSTEMDIR/libs"
          fi
          export SDL_GAMECONTROLLERCONFIG="${sdl_controllerconfig:-}"

          GPTOKEYB_PID=""
          if [ -n "${GPTOKEYB:-}" ] && [ -x "$GPTOKEYB" ]; then
              "$GPTOKEYB" "Unreal.bin" &
              GPTOKEYB_PID=$!
          fi

          pm_platform_helper "$GAME" >/dev/null 2>&1 || true
          "$GAME" LOG=../log.txt
          GAME_STATUS=$?

          if [ -n "$GPTOKEYB_PID" ]; then
              kill "$GPTOKEYB_PID" 2>/dev/null || true
              wait "$GPTOKEYB_PID" 2>/dev/null || true
          fi
          pm_finish
          echo "[UE1] game exited with status $GAME_STATUS"
          exit "$GAME_STATUS"
          EOF
          chmod 755 'package/Unreal.sh'

          cat > package/unreal/port.json <<'EOF'
          {
            "version": 1,
            "name": "unreal.zip",
            "items": ["Unreal.sh", "unreal"],
            "items_opt": [],
            "attr": {
              "title": "Unreal Engine 1",
              "porter": ["CrispyBuns"],
              "desc": "Unreal Engine 1 v200 ARM64 port for RG35XX-H / KNULLI. Requires original Unreal v200 or v205 demo game data.",
              "inst": "Copy your legally obtained Unreal v200 retail or v205 demo System game data into ports/unreal/System. Do not overwrite the engine executable or driver libraries.",
              "genres": ["action"],
              "availability": "free",
              "arch": ["aarch64"],
              "min_glibc": "2.35"
            }
          }
          EOF

          cd package
          zip -r ../unreal-rg35xx-h-autoinstall.zip 'Unreal.sh' unreal

      - name: Upload PortMaster autoinstall ZIP
        uses: actions/upload-artifact@v4
        with:
          name: unreal-rg35xx-h-autoinstall
          path: unreal-rg35xx-h-autoinstall.zip
          if-no-files-found: error
          retention-days: 14

      - name: Archive debug symbols
        run: tar -czf unreal-rg35xx-h-debug-symbols.tar.gz debug-symbols

      - name: Upload separate debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: unreal-rg35xx-h-debug-symbols
          path: unreal-rg35xx-h-debug-symbols.tar.gz
          if-no-files-found: error
          retention-days: 30
