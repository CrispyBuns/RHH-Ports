name: Build Z3R-Beta for RG35XX-H

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v4

      - name: Checkout Z3R-Beta
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/Z3R-Beta
          path: z3r-beta
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsdl2-dev \
            python3 \
            zip

      - name: Build Z3R-Beta
        shell: bash
        working-directory: z3r-beta
        env:
          CFLAGS: "-O3 -flto -ffast-math -mcpu=cortex-a53 -mtune=cortex-a53"
          LDFLAGS: "-flto"
        run: |
          set -eux

          make clean || true
          make

          test -f zelda3

      - name: Prepare PortMaster package
        shell: bash
        run: |
          set -eux

          mkdir -p package/zelda3

          cp z3r-beta/zelda3 package/zelda3/
          cp z3r-beta/zelda3.ini package/zelda3/

          sed -i \
            -e 's/^NewRenderer[[:space:]]*=.*/NewRenderer = 0/' \
            -e 's/^OutputMethod[[:space:]]*=.*/OutputMethod = SDL-Software/' \
            -e 's/^LinearFiltering[[:space:]]*=.*/LinearFiltering = 0/' \
            package/zelda3/zelda3.ini

          if [ -f z3r-beta/zelda3.gptk ]; then
            cp z3r-beta/zelda3.gptk package/zelda3/
          fi

          cat > package/zelda3/zelda3.sh <<'EOF'
          #!/bin/bash

          XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"

          if [ -d "/opt/system/Tools/PortMaster" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source "$controlfolder/control.txt"
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && \
            source "${controlfolder}/mod_${CFW_NAME}.txt"

          get_controls

          GAMEDIR="/$directory/ports/zelda3"
          GAME="$GAMEDIR/zelda3"

          cd "$GAMEDIR" || exit 1
          exec > >(tee "$GAMEDIR/log.txt") 2>&1

          echo "Z3R-Beta for RG35XX-H"
          echo "Target: ARM64 Cortex-A53"
          echo "Renderer: SDL-Software"
          echo "NewRenderer: 0"
          echo "Optimization: -O3 -ffast-math -flto"

          chmod +x "$GAME"
          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"

          $GPTOKEYB "$GAME" -c "$GAMEDIR/zelda3.gptk" &
          pm_platform_helper "$GAME" >/dev/null 2>&1 &

          "$GAME"
          pm_finish
          EOF

          chmod +x package/zelda3/zelda3.sh

          cat > package/zelda3/README.txt <<'EOF'
          Z3R-Beta - RG35XX-H / KNULLI

          Target: ARM64 Cortex-A53
          Renderer: SDL-Software
          NewRenderer: 0
          Optimization: -O3, -ffast-math, LTO

          Runtime log: log.txt
          EOF

          cd package
          zip -r ../Z3R-Beta-RG35XX-H.zip zelda3

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z3R-Beta-RG35XX-H
          path: Z3R-Beta-RG35XX-H.zip
          if-no-files-found: error
