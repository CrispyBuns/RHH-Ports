name: Build Ports

on:
  workflow_dispatch:
    inputs:
      port:
        description: "Which port to consider (all = every port in registry)"
        type: string
        required: false
        default: "all"
      force-build:
        description: "Force build (bypass SHA check, upload artifact only, no commit)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: build-ports
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute matrix
        id: compute
        run: |
          set -euo pipefail
          SELECTED="${{ inputs.port }}"
          FORCE="${{ inputs.force-build }}"
          : "${SELECTED:=all}"
          : "${FORCE:=false}"
          if [[ "$SELECTED" == "all" ]]; then
            ids=$(jq -r '.ports | keys[]' buildtools/registry.json)
          else
            jq -e --arg id "$SELECTED" '.ports[$id]' buildtools/registry.json >/dev/null || { echo "Port '$SELECTED' not found"; exit 1; }
            ids="$SELECTED"
          fi
          matrix_entries=()
          while read -r id; do
            [[ -z "$id" ]] && continue
            repo=$(jq -r --arg id "$id" '.ports[$id].upstream_repo' buildtools/registry.json)
            track_mode=$(jq -r --arg id "$id" '.ports[$id].track // "branch"' buildtools/registry.json)
            if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$track_mode" != "release" ]]; then continue; fi
            if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$id" == "sm64-ghostship" ]]; then continue; fi
            first_target=$(jq -r --arg id "$id" '.ports[$id].target_dirs[0]' buildtools/registry.json)
            case "$track_mode" in
              release)
                tag=$(curl -sf "https://api.github.com/repos/$repo/releases/latest" | jq -r .tag_name) || tag=""
                [[ -z "$tag" || "$tag" == "null" ]] && continue
                ref=$(curl -sf "https://api.github.com/repos/$repo/git/ref/tags/$tag") || ref=""
                [[ -z "$ref" ]] && continue
                ref_type=$(echo "$ref" | jq -r .object.type)
                if [[ "$ref_type" == "tag" ]]; then
                  tag_obj_url=$(echo "$ref" | jq -r .object.url)
                  upstream_sha=$(curl -sf "$tag_obj_url" | jq -r .object.sha) || upstream_sha=""
                else upstream_sha=$(echo "$ref" | jq -r .object.sha); fi
                label="$tag"
                ;;
              branch|*)
                branch=$(jq -r --arg id "$id" '.ports[$id].upstream_branch' buildtools/registry.json)
                upstream_sha=$(curl -sf "https://api.github.com/repos/$repo/commits/$branch" | jq -r .sha) || upstream_sha=""
                label="${upstream_sha:0:7}"
                ;;
            esac
            [[ -z "$upstream_sha" || "$upstream_sha" == "null" ]] && continue
            origin_sha=""
            [[ -f "$first_target/.upstream-sha" ]] && origin_sha=$(cat "$first_target/.upstream-sha")
            if [[ "$FORCE" == "true" || "$upstream_sha" != "$origin_sha" ]]; then
              base=$(jq -r --arg id "$id" '.ports[$id].base // "rhh-base"' buildtools/registry.json)
              matrix_entries+=("$(jq -cn --arg id "$id" --arg sha "$upstream_sha" --arg label "$label" --arg base "$base" '{id:$id,upstream_sha:$sha,label:$label,base:$base}')")
            fi
          done <<< "$ids"
          if (( ${#matrix_entries[@]} == 0 )); then matrix="[]"; else matrix=$(printf '%s\n' "${matrix_entries[@]}" | jq -cs .); fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  base-image:
    runs-on: ubuntu-24.04-arm
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          digest=$(sha1sum buildtools/Dockerfile.base | cut -c1-12)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/rhh-base:$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push if not cached
        run: |
          set -euo pipefail
          image="${{ steps.tag.outputs.image }}"
          if docker pull "$image" >/dev/null 2>&1; then exit 0; fi
          docker build --platform linux/aarch64 -t "$image" -f buildtools/Dockerfile.base buildtools/
          docker push "$image"

  build:
    runs-on: ubuntu-24.04-arm
    needs: [discover, base-image]
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        port: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 development dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull rhh-base from GHCR
        if: matrix.port.base == 'rhh-base'
        run: |
          set -euo pipefail
          docker pull "${{ needs.base-image.outputs.image }}"
          docker tag "${{ needs.base-image.outputs.image }}" rhh-base
      - name: Build port
        id: build
        continue-on-error: ${{ inputs.port == '' || inputs.port == 'all' }}
        run: |
          set -uo pipefail
          FORCE="${{ inputs.force-build }}"; : "${FORCE:=false}"
          id='${{ matrix.port.id }}'
          port_dir=$(jq -r --arg id "$id" '.ports[$id].port_dir' buildtools/registry.json)
          mkdir -p _ci/status
          bash buildtools/build_port.sh "$port_dir" 2>&1 | tee _ci/status/build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Validate artifacts and sync to target_dirs
        id: sync
        if: steps.build.outputs.rc == '0' && inputs.force-build != true
        run: |
          set -euo pipefail
          id='${{ matrix.port.id }}'
          port_dir=$(jq -r --arg id "$id" '.ports[$id].port_dir' buildtools/registry.json)
          mapfile -t target_dirs < <(jq -r --arg id "$id" '.ports[$id].target_dirs[]' buildtools/registry.json)
          commit_prefix=$(jq -r --arg id "$id" '.ports[$id].commit_prefix' buildtools/registry.json)
          artifacts=$(jq -r --arg id "$id" '.ports[$id].artifacts[]' buildtools/registry.json)
          upstream_sha='${{ matrix.port.upstream_sha }}'
          label='${{ matrix.port.label }}'
          missing=()
          shopt -s nullglob
          while read -r a; do
            [[ -z "$a" ]] && continue
            if [[ "$a" == *\** ]]; then matches=($port_dir/$a); (( ${#matches[@]} == 0 )) && missing+=("$a"); elif [[ ! -e "$port_dir/$a" ]]; then missing+=("$a"); fi
          done <<< "$artifacts"
          shopt -u nullglob
          if (( ${#missing[@]} > 0 )); then echo "::error::[$id] missing artifacts: ${missing[*]}"; exit 1; fi
          shopt -s nullglob
          for target_dir in "${target_dirs[@]}"; do
            mkdir -p "$target_dir"
            while read -r a; do
              [[ -z "$a" ]] && continue
              if [[ "$a" == *\** ]]; then
                for f in $port_dir/$a; do cp -r "$f" "$target_dir/$(basename "$f")"; done
              else
                mkdir -p "$target_dir/$(dirname "$a")"
                if [[ -d "$port_dir/$a" ]]; then rm -rf "$target_dir/$a"; cp -r "$port_dir/$a" "$target_dir/$a"; else cp "$port_dir/$a" "$target_dir/$a"; fi
              fi
            done <<< "$artifacts"
            echo "$upstream_sha" > "$target_dir/.upstream-sha"
          done
          shopt -u nullglob
          mkdir -p _ci/payload
          tar czf "_ci/payload/payload.tar.gz" "${target_dirs[@]}"
          jq -cn --arg id "$id" --arg prefix "$commit_prefix" --arg label "$label" --arg sha "$upstream_sha" --argjson targets "$(printf '%s\n' "${target_dirs[@]}" | jq -R . | jq -s .)" '{id:$id,prefix:$prefix,label:$label,sha:$sha,targets:$targets}' > _ci/payload/metadata.json

      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.port.id }}
          path: _ci/status/
          if-no-files-found: ignore

      - name: Upload port package
        if: steps.build.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: phase-distorter-build-${{ matrix.port.label }}
          path: ${{ fromJSON(needs.discover.outputs.matrix)[0].id == matrix.port.id && 'ports/released/phase-distorter/phase-distorter' || format('{0}', 'ports/released/phase-distorter/phase-distorter') }}
          if-no-files-found: error
