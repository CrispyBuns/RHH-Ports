name: Build Mega Man X SNES Recomp - RG35XX-H

on:
  workflow_dispatch:
  push:
    branches:
      - mmx-sdl2-knulli

permissions:
  contents: read

env:
  CFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
  CXXFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
  LDFLAGS: "-Wl,--gc-sections"
  MAKEFLAGS: "-j4"

jobs:
  build:
    runs-on: ubuntu-20.04-arm

    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config zip libsdl2-dev

      - name: Checkout Mega Man X SNES Recomp
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/MegaManXSNESRecomp-RG35XXX-H
          ref: main
          submodules: recursive
          path: MegaManXSNESRecomp

      - name: Configure ARM64 SDL2 release build
        run: |
          set -euxo pipefail
          cmake -S MegaManXSNESRecomp -B MegaManXSNESRecomp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF \
            -DSNESRECOMP_STATIC_RUNTIME=OFF \
            -DSNESRECOMP_FRAME_IMPL=LLE \
            -DSNESRECOMP_APU_TIME_IMPL=LLE \
            -DSNESRECOMP_CRC32_IMPL=BYTE \
            -DCMAKE_BUILD_RPATH='$ORIGIN/libs' \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/libs'

      - name: Build
        run: |
          set -euxo pipefail
          cmake --build MegaManXSNESRecomp/build --parallel 4

      - name: Verify binary and prepare port
        run: |
          set -euxo pipefail
          mkdir -p package/mmx/libs
          BIN="$(find MegaManXSNESRecomp/build -maxdepth 3 -type f -perm -111 | grep -E '/(MegaManXSNESRecomp|mmx|game)$' | head -n1 || true)"
          if [ -z "$BIN" ]; then
            BIN="$(find MegaManXSNESRecomp/build -maxdepth 4 -type f -perm -111 | head -n1)"
          fi
          test -n "$BIN"
          install -m 755 "$BIN" package/mmx/MegaManXSNESRecomp
          printf '%s\n' 'Place your legally obtained Mega Man X ROM in the mmx folder as instructed by the port launcher.' > package/mmx/README-ROM.txt
          printf '%s\n' '#!/bin/sh' 'PORTDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"' 'cd "$PORTDIR/mmx"' 'export SDL_VIDEODRIVER="fbcon"' 'export SDL_AUDIODRIVER="alsa"' 'export SDL_RENDER_DRIVER="software"' 'exec ./MegaManXSNESRecomp "$@" >> "$PORTDIR/mmx/log.txt" 2>&1' > package/Mega Man X.sh
          chmod 755 package/Mega\ Man\ X.sh
          printf '%s\n' '{' '  "version": 4,' '  "name": "mmx-snes-recomp.zip",' '  "items": ["Mega Man X.sh", "mmx"],' '  "items_opt": [],' '  "attr": {' '    "title": "Mega Man X SNES Recomp",' '    "porter": ["CrispyBuns"],' '    "desc": "Mega Man X SNES Recomp for RG35XX-H / KNULLI",' '    "inst": "Place your own supported Mega Man X ROM in the mmx folder.",' '    "genres": ["action"],' '    "arch": ["aarch64"],' '    "availability": "free"' '  }' '}' > package/mmx/port.json
          cd package
          zip -r ../mmx-snes-recomp.zip "Mega Man X.sh" mmx

      - name: Upload autoinstall package
        uses: actions/upload-artifact@v4
        with:
          name: mmx-snes-recomp-autoinstall
          path: mmx-snes-recomp.zip
          if-no-files-found: error
          retention-days: 14
