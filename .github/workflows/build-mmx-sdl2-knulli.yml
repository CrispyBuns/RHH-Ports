name: Build Mega Man X SNES Recomp - RG35XX-H

on:
  workflow_dispatch:
  push:
    branches:
      - mmx-sdl2-knulli

permissions:
  contents: read

env:
  CFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
  CXXFLAGS: "-O3 -march=armv8-a -mtune=cortex-a53 -ffunction-sections -fdata-sections"
  LDFLAGS: "-Wl,--gc-sections"
  MAKEFLAGS: "-j4"

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout RHH-Ports
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config zip python3 python3-pil libsdl2-dev

      - name: Checkout Mega Man X SNES Recomp
        uses: actions/checkout@v4
        with:
          repository: CrispyBuns/MegaManXSNESRecomp-RG35XXX-H
          ref: main
          submodules: recursive
          path: MegaManXSNESRecomp

      # Configure these repository secrets in CrispyBuns/RHH-Ports:
      # MMX_ROM_REPO = owner/repository containing your private ROM files
      # MMX_ROM_TOKEN = fine-grained PAT with Contents: Read-only access to that repository
      - name: Checkout private ROM repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MMX_ROM_REPO }}
          token: ${{ secrets.MMX_ROM_TOKEN }}
          path: private-mmx-roms
          persist-credentials: false

      - name: Stage MMX1 game ROM and MMX3 donor ROM
        run: |
          set -euxo pipefail
          mkdir -p rom-staging
          find private-mmx-roms -type f \( -iname '*.sfc' -o -iname '*.smc' \) -not -path '*/.git/*' -exec cp -f {} rom-staging/ \;
          echo "ROM files found:"
          find rom-staging -maxdepth 1 -type f -printf '%f\n'
          test "$(find rom-staging -maxdepth 1 -type f \( -iname '*.sfc' -o -iname '*.smc' \) | wc -l)" -gt 0
          # The primary ROM must be MMX1. MMX3 is only staged as a donor ROM; the
          # game extracts/uses X3 assets through its in-game Mods UI, not regen.sh.
          if ! find rom-staging -maxdepth 1 -type f \( -iname '*mega*man*x*' -o -iname '*megaman*x*' -o -iname '*mmx1*' -o -iname '*rockman*x*' \) | grep -Eiv 'x2|x3' | grep -q .; then
            echo "WARNING: Could not identify an MMX1 ROM by filename. Ensure the private ROM repo uses a clear MMX1 filename."
          fi

      - name: Generate MMX1 recompilation sources from verified ROM
        run: |
          set -euxo pipefail
          MMX1_ROM="$(find rom-staging -maxdepth 1 -type f \( -iname '*mega*man*x*' -o -iname '*megaman*x*' -o -iname '*mmx1*' -o -iname '*rockman*x*' \) -print | grep -Eiv 'x2|x3' | head -n 1 || true)"
          if [ -z "$MMX1_ROM" ]; then
            echo "ERROR: MMX1 ROM not found. Expected a clearly named Mega Man X (USA) ROM in the private ROM repository."
            exit 1
          fi
          echo "Generating source from: $MMX1_ROM"
          install -m 644 "$MMX1_ROM" MegaManXSNESRecomp/mmx.sfc
          cd MegaManXSNESRecomp
          bash tools/regen.sh usa --no-tests
          test -s src/gen/dispatch_v2.c
          echo "Generated source files:"
          find src/gen -maxdepth 1 -type f | head -n 20

      - name: Configure ARM64 SDL2 + A53 + LTO
        run: |
          set -euxo pipefail
          cmake -S MegaManXSNESRecomp -B MegaManXSNESRecomp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DSNESRECOMP_SDL_BACKEND=SDL2 \
            -DSNESRECOMP_SDL3_FETCH=OFF \
            -DSNESRECOMP_STATIC_RUNTIME=OFF \
            -DSNESRECOMP_FRAME_IMPL=LLE \
            -DSNESRECOMP_APU_TIME_IMPL=LLE \
            -DSNESRECOMP_CRC32_IMPL=BYTE \
            -DMMX_RASTER_IMPL=LLE \
            -DMMX_RASTER_FULL_COPY=OFF \
            -DMMX_STAGE_TILE_REUSE=ON \
            -DMMX_NATIVE_ROW_PLAN=OFF \
            -DMMX_NATIVE_BG_SPANS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_C_FLAGS="${CFLAGS} -flto=auto" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS} -flto=auto" \
            -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS} -flto=auto" \
            -DCMAKE_BUILD_RPATH='$ORIGIN/libs' \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/libs'

      - name: Build MegaManXSNESRecomp
        run: |
          set -euxo pipefail
          cmake --build MegaManXSNESRecomp/build --target MegaManXSNESRecomp --parallel 4
          test -x MegaManXSNESRecomp/build/MegaManXSNESRecomp
          file MegaManXSNESRecomp/build/MegaManXSNESRecomp

      - name: Assemble PortMaster autoinstall package
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p package/mmx
          # Empty mapping: native SDL keeps gameplay input; gptokeyb supplies Start+Select exit only.
          cat > 'package/mmx/Mega Man X.gptk' <<'EOF'
          # Native SDL controller handling; no gameplay remapping.
          EOF
          install -m 755 MegaManXSNESRecomp/build/MegaManXSNESRecomp package/mmx/MegaManXSNESRecomp
          cp -f rom-staging/* package/mmx/

          cat > package/mmx/port.json <<'EOF'
          {
            "version": 4,
            "name": "mmx-snes-recomp.zip",
            "items": ["Mega Man X.sh", "mmx"],
            "items_opt": [],
            "attr": {
              "title": "Mega Man X SNES Recomp",
              "porter": ["CrispyBuns"],
              "desc": "Mega Man X SNES Recomp for RG35XX-H / KNULLI; MMX3 extra content staged with MMX1",
              "inst": "Provide a supported Mega Man X (MMX1) ROM as the main game. The MMX3 ROM is staged in the folder as a donor ROM; select it in the game's Mods UI to extract/use X3 content.",
              "genres": ["action"],
              "availability": "paid",
              "arch": ["aarch64"],
              "min_glibc": "2.31"
            }
          }
          EOF

          cat > 'package/Mega Man X.sh' <<'EOF'
          #!/bin/sh
          set -u
          PORTDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          cd "$PORTDIR/mmx" || exit 1
          LOG="$PORTDIR/mmx/log.txt"
          : > "$LOG"
          exec >> "$LOG" 2>&1
          
          echo "[Mega Man X] launcher started"
          echo "Firmware: KNULLI / RG35XX-H"
          echo "Architecture: $(uname -m)"
          echo "Kernel: $(uname -sr)"
          echo "SDL backend: SDL2"
          echo "CPU tuning: Cortex-A53 / armv8-a / LTO"
          echo "--- files ---"
          ls -la
          
          # Select MMX1 only as the main game. X3 assets are selected/extracted through the game's Mods UI.
          ROM=""
          for candidate in ./*.sfc ./*.smc; do
            [ -f "$candidate" ] || continue
            lower="$(printf '%s' "$candidate" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *x3*|*mmx3*|*x2*|*mmx2*) continue ;;
            esac
            case "$lower" in
              *mega*man*x*|*megaman*x*|*mmx1*|*rockman*x*)
                ROM="$candidate"
                break
                ;;
            esac
          done
          if [ -z "$ROM" ]; then
            echo "ERROR: could not identify the MMX1 main ROM. Name it clearly (e.g. Mega Man X (USA).sfc)."
            echo "MMX3 files are kept in this folder for extra content and are not selected as the main game."
            exit 1
          fi
          
          echo "Main game ROM: $ROM"
          echo "MMX3 donor ROM(s) are staged; select the X3 ROM in Mods to activate X3 content."
          echo "--- game output begins ---"
          export SDL_VIDEODRIVER="fbcon"
          export SDL_AUDIODRIVER="alsa"
          export SDL_RENDER_DRIVER="software"
          # Keep PortMaster's Start+Select kill switch active without remapping gameplay buttons.
          GPTOKEYB_BIN="${GPTOKEYB:-}"
          if [ -z "$GPTOKEYB_BIN" ]; then
            for candidate in "${PORTMASTER:-}/gptokeyb" "${PORTMASTER_DIR:-}/gptokeyb" /userdata/system/.local/share/PortMaster/gptokeyb /roms/ports/PortMaster/gptokeyb; do
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then GPTOKEYB_BIN="$candidate"; break; fi
            done
          fi
          GPTOKEYB_PID=""
          if [ -n "$GPTOKEYB_BIN" ] && [ -x "$GPTOKEYB_BIN" ]; then
            "$GPTOKEYB_BIN" "MegaManXSNESRecomp" -c "Mega Man X.gptk" &
            GPTOKEYB_PID=$!
            echo "gptokeyb started; Start+Select exit hotkey enabled."
          else
            echo "WARNING: gptokeyb not found; Start+Select exit hotkey unavailable."
          fi
          ./MegaManXSNESRecomp --rom "$ROM" "$@"
          GAME_STATUS=$?
          if [ -n "$GPTOKEYB_PID" ]; then kill "$GPTOKEYB_PID" 2>/dev/null || true; wait "$GPTOKEYB_PID" 2>/dev/null || true; fi
          echo "Game exited with status $GAME_STATUS"
          exit "$GAME_STATUS"
          EOF
          chmod 755 'package/Mega Man X.sh'

          cd package
          zip -r ../mmx-snes-recomp.zip 'Mega Man X.sh' mmx

      - name: Upload autoinstall ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mmx-snes-recomp-autoinstall
          path: mmx-snes-recomp.zip
          if-no-files-found: error
          retention-days: 14
